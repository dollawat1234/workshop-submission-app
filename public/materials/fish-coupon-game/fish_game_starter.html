<!doctype html>
<html lang="th"><head><meta charset="utf-8"><title>Fish Friends Starter</title>
<style>body{font-family:system-ui,sans-serif;background:#dff6ff;text-align:center;padding:32px}button{padding:12px 18px;border:0;border-radius:12px;background:#1e5af6;color:#fff;font-weight:700}img{max-width:280px;height:220px;object-fit:contain}</style></head>
<body><h1>Fish Friends Starter</h1><p>ใช้ fish_stage1_baby.png, fish_stage2_growing.png, fish_stage3_mature.png, fish_food.png และ fish_coupon_15_percent.png</p><img id="fish" src="fish_stage1_baby.png" alt="ปลาเริ่มต้น"><p id="status">ระดับ 1 / 3</p><button id="feed">ให้อาหารปลา</button><script>let level=1;document.querySelector('#feed').addEventListener('click',()=>{level=Math.min(3,level+1);document.querySelector('#fish').src=`fish_stage${level}_${level===1?'baby':level===2?'growing':'mature'}.png`;document.querySelector('#status').textContent=level===3?'รับคูปองส่วนลดได้แล้ว!':'ระดับ '+level+' / 3';});</script></body></html>
