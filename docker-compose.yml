services:
  teamgame:
    build: .
    container_name: teamgame-app
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      STORAGE_ROOT: /var/lib/teamgame
      REQUIRE_SPEAKER_AUTH: ${REQUIRE_SPEAKER_AUTH:-true}
      SPEAKER_KEY: ${SPEAKER_KEY:?SPEAKER_KEY must be set}
    volumes:
      - /srv/teamgame:/var/lib/teamgame
    labels:
      - traefik.enable=true
      - traefik.http.routers.teamgame.rule=Host(`teamgame.vitanovainhouse.tech`)
      - traefik.http.routers.teamgame.entrypoints=websecure
      - traefik.http.routers.teamgame.tls.certresolver=letsencrypt
      - traefik.http.routers.teamgame.priority=10
      - traefik.http.services.teamgame.loadbalancer.server.port=3000
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/debug-status').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
